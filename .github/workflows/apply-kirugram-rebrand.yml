name: Apply Kirugram namespace migration

on:
  push:
    branches:
      - rebrand/kirugram

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rewrite internal imports and references
        run: python tools/rebrand_kirugram.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining namespace references."
          else
            git commit -m "refactor: migrate internal imports to kirugram [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
